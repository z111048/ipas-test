name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run quality gate
        run: uv run python tests/run_all.py

  build:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4
        id: pages

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Verify external static assets
        if: vars.VITE_ASSET_BASE_URL != ''
        run: uv run python scripts/verify_r2_assets.py --base "$ASSET_BASE_URL"
        env:
          ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}

      - name: Build publish artifact
        run: uv run python scripts/build_web.py
        env:
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # 靜態資產（pdf-assets / images）的來源。留空 = 由本站提供（現況）。
          # 資產搬到 Cloudflare R2 之後，在 repo 的 Variables 設 VITE_ASSET_BASE_URL
          # （例 https://assets.example.com）即可全站切換——資料 JSON 一個字都不用改，
          # 因為所有圖片 URL 都經過 frontend/src/utils/assets.ts 的 publicAsset()。
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
