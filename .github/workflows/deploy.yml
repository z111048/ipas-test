name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4
        id: pages

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # 靜態資產（pdf-assets / images）的來源。留空 = 由本站提供（現況）。
          # 資產搬到 Cloudflare R2 之後，在 repo 的 Variables 設 VITE_ASSET_BASE_URL
          # （例 https://assets.example.com）即可全站切換——資料 JSON 一個字都不用改，
          # 因為所有圖片 URL 都經過 frontend/src/utils/assets.ts 的 publicAsset()。
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
